<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adaptation Planning Tool</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f5f4a'/%3E%3Cpath fill='%23fff' d='M12 3.5C8 6.8 5.8 10 5.8 13.2a6.2 6.2 0 0 0 12.4 0c0-3.2-2.2-6.4-6.2-9.7Zm0 15.6a4.8 4.8 0 0 1-4.8-4.8c0-2 1.4-4.4 3.9-6.9v11.7h.9Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 2C7 6 4 10 4 14a8 8 0 0 0 16 0c0-4-3-8-8-12Zm0 18a6 6 0 0 1-6-6c0-2.6 1.8-5.6 5-8.8V20h1Z"/></svg>
      </div>
      <div>
        <h1 id="appTitle">Biodiversity Climate Adaptation Planning</h1>
        <div class="sub"><span id="appSubtitle">Site Assessment</span> <a id="resourceLink" hidden target="_blank" rel="noopener">Resource library ↗</a></div>
      </div>
    </div>
    <div class="file-actions">
      <button type="button" class="btn small ghost-light" id="btnNew">New plan</button>
      <button type="button" class="btn small ghost-light" id="btnOpen">Open plan file</button>
      <button type="button" class="btn small light" id="btnSave">Save plan file</button>
      <input type="file" id="openFile" accept=".json,application/json" hidden>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Plan sections"></nav>
  <div class="status-bar"><span id="saveStatus" role="status"></span></div>
  <main id="panel" class="panel" role="tabpanel"></main>

  <script src="js/content.js"></script>
  <script src="js/overview.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/example.js"></script>
  <script src="js/app.js"></script>
  <script src="js/export.js"></script>
  <script src="js/pathbuilder.js"></script><!-- TEST TAB -->
  <script src="lib/docx.js" defer></script>
  <script src="lib/pdfmake.min.js" defer></script>
  <script src="lib/vfs_fonts.js" defer></script>
</body>
</html>

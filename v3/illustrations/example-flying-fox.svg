<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <!-- Stylised spectacled flying-fox roosting at dusk (illustration, not a photo) -->
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a4f"/>
      <stop offset="0.6" stop-color="#3f6f78"/>
      <stop offset="1" stop-color="#e2a96a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe6b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#dusk)"/>
  <circle cx="640" cy="120" r="110" fill="url(#glow)"/>
  <circle cx="640" cy="120" r="38" fill="#fff1cf"/>
  <!-- distant canopy -->
  <path d="M0 430 C60 400 110 415 160 395 C220 372 270 400 330 388 C400 374 450 402 520 390 C590 378 640 400 700 386 C750 376 780 384 800 380 L800 500 L0 500 Z" fill="#244a4d"/>
  <!-- branch -->
  <path d="M-10 92 C120 84 240 100 360 96 C480 92 590 78 700 86 C750 90 790 84 820 80" fill="none" stroke="#3a2a1e" stroke-width="18" stroke-linecap="round"/>
  <path d="M560 84 C600 60 640 52 690 40" fill="none" stroke="#3a2a1e" stroke-width="9" stroke-linecap="round"/>
  <g fill="#2f5b3a">
    <path d="M690 40 c20 -14 46 -10 56 4 c-20 10 -42 10 -56 -4z"/>
    <path d="M640 52 c10 -22 36 -30 52 -22 c-12 18 -32 26 -52 22z"/>
    <path d="M110 92 c-8 22 -2 46 12 54 c8 -20 4 -42 -12 -54z"/>
    <path d="M150 90 c18 14 22 38 12 52 c-14 -12 -18 -34 -12 -52z"/>
  </g>
  <!-- main flying-fox, hanging -->
  <g transform="translate(400 0)">
    <path d="M-16 96 l-4 30 M14 96 l4 30" stroke="#1d1611" stroke-width="7" stroke-linecap="round"/>
    <!-- wrapped wings / body -->
    <path d="M-52 122 C-74 190 -66 262 0 320 C66 262 74 190 52 122 C30 110 -30 110 -52 122 Z" fill="#2a211b"/>
    <path d="M-40 140 C-50 200 -40 250 -8 300 M40 140 C50 200 40 250 8 300 M0 128 L0 300" stroke="#3d3128" stroke-width="5" fill="none"/>
    <!-- golden mantle around the neck -->
    <path d="M-46 280 C-30 312 30 312 46 280 C40 300 22 318 0 322 C-22 318 -40 300 -46 280 Z" fill="#c9923e"/>
    <!-- head (hanging upside down: ears point down) -->
    <ellipse cx="0" cy="350" rx="40" ry="36" fill="#3a2d24"/>
    <path d="M-26 374 L-38 410 L-12 384 Z M26 374 L38 410 L12 384 Z" fill="#2a211b"/>
    <!-- muzzle -->
    <ellipse cx="0" cy="326" rx="15" ry="20" fill="#2a211b"/>
    <!-- "spectacles": pale rings around the eyes -->
    <ellipse cx="-16" cy="352" rx="12" ry="11" fill="#e8cf8f"/>
    <ellipse cx="16" cy="352" rx="12" ry="11" fill="#e8cf8f"/>
    <circle cx="-16" cy="352" r="6" fill="#120d09"/>
    <circle cx="16" cy="352" r="6" fill="#120d09"/>
    <circle cx="-14" cy="350" r="1.8" fill="#fff"/>
    <circle cx="18" cy="350" r="1.8" fill="#fff"/>
  </g>
  <!-- second flying-fox, further back -->
  <g transform="translate(205 0) scale(0.62)" opacity="0.85">
    <path d="M-16 150 l-4 30 M14 150 l4 30" stroke="#1d1611" stroke-width="9" stroke-linecap="round"/>
    <path d="M-52 176 C-74 244 -66 316 0 374 C66 316 74 244 52 176 C30 164 -30 164 -52 176 Z" fill="#241c17"/>
    <path d="M-46 334 C-30 366 30 366 46 334 C40 354 22 372 0 376 C-22 372 -40 354 -46 334 Z" fill="#a8783a"/>
    <ellipse cx="0" cy="404" rx="40" ry="36" fill="#30251e"/>
    <path d="M-26 428 L-38 464 L-12 438 Z M26 428 L38 464 L12 438 Z" fill="#241c17"/>
    <ellipse cx="-16" cy="406" rx="12" ry="11" fill="#d9bf80"/>
    <ellipse cx="16" cy="406" rx="12" ry="11" fill="#d9bf80"/>
    <circle cx="-16" cy="406" r="6" fill="#120d09"/>
    <circle cx="16" cy="406" r="6" fill="#120d09"/>
  </g>
</svg>
